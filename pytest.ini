[pytest]
testpaths = pruebas
python_files = test_*.py
addopts = -q --tb=short
markers =
    etapa0: diagnóstico
    etapa1: dividir y conquistar, cohesión
    etapa2: acoplamiento
    etapa3: abstracción y reuso
    etapa4: flexibilidad, obsolescencia, portabilidad
    etapa5: testabilidad
    etapa6: diseño defensivo
